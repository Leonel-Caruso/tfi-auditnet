# Tests de backend, frontend y pantallas; si pasan, publica las 3 imágenes en ghcr.io y las
# despliega en Azure Container Apps tras aprobar el entorno "azure" (login por OIDC,
# ver infra/azure/06-configurar-github-oidc.sh). Solo main se despliega; test corre las pruebas.
name: CI e imagenes

on:
  push:
    branches: [main, test]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/pantallas/**"
      - "tests/datos_demo/**"
      - "scripts/datos-demo/**"
      - "infra/azure/**"
      - ".github/workflows/imagenes.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests-backend:
    name: Tests ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [management-service, audit-core-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.servicio }}/pom.xml
      - name: mvn test
        working-directory: backend/${{ matrix.servicio }}
        run: mvn -B test

  frontend:
    name: Chequeo y build del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json
      # build:pruebas llama a la API en el mismo origen, como detrás de nginx (la imagen Docker hace lo mismo).
      - name: npm ci, check y build
        working-directory: frontend/web-app
        run: |
          npm ci
          npm run check
          npm run build:pruebas
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: frontend/web-app/dist
          retention-days: 1

  pantallas:
    name: Pruebas de pantalla
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: frontend/web-app/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/pantallas/requirements.txt
      - name: Playwright y Chromium
        run: |
          pip install -r tests/pantallas/requirements.txt
          python -m playwright install --with-deps chromium
      - name: pytest
        run: python -m pytest tests/pantallas
      - name: Datos de demostración
        run: python -m pytest tests/datos_demo

  imagenes:
    name: Imagen ${{ matrix.imagen }}
    needs: [tests-backend, frontend, pantallas]
    runs-on: ubuntu-latest
    strategy:
      # Si una imagen falla, las otras terminan igual.
      fail-fast: false
      matrix:
        include:
          - imagen: auditnet-management
            contexto: backend/management-service
          - imagen: auditnet-core
            contexto: backend/audit-core-service
          - imagen: auditnet-web
            contexto: frontend/web-app
    steps:
      - uses: actions/checkout@v4
      - name: Nombre del registro en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.imagen }}:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.imagen }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  desplegar:
    name: Desplegar en Azure (con aprobación)
    needs: [imagenes]
    # Solo desde main y con las variables de Azure cargadas; si no, se omite y el CI sigue en verde.
    if: ${{ vars.AZURE_CLIENT_ID != '' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    # El entorno "azure" tiene revisores obligatorios.
    environment:
      name: azure
      url: ${{ steps.humo.outputs.url }}
    # Nunca dos despliegues a la vez; uno nuevo espera a que termine el anterior.
    concurrency:
      group: despliegue-azure
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar sesión en Azure (OIDC, sin contraseñas)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Actualizar las 3 Container Apps a sha-${{ github.sha }}
        run: bash infra/azure/03-actualizar-imagenes.sh "sha-${{ github.sha }}"
      - name: Prueba de humo
        id: humo
        run: |
          source infra/azure/variables.sh
          # Azure a veces responde GatewayTimeout a una consulta: se reintenta antes de dar el despliegue por fallido.
          consultar() {
            local salida
            for intento in 1 2 3 4; do
              if salida=$(az "$@" 2>/dev/null); then printf '%s' "$salida"; return 0; fi
              sleep 15
            done
            az "$@"
          }
          # Cada app tiene la imagen de este commit y su revisión nueva quedó aprovisionada.
          for app in "$APP_MANAGEMENT" "$APP_CORE" "$APP_WEB"; do
            imagen=$(consultar containerapp show -n "$app" -g "$RG" --query "properties.template.containers[0].image" -o tsv)
            [[ "$imagen" == *":sha-$GITHUB_SHA" ]] || { echo "::error::$app quedó con $imagen"; exit 1; }
            revision=$(consultar containerapp show -n "$app" -g "$RG" --query properties.latestRevisionName -o tsv)
            for intento in $(seq 1 30); do
              estado=$(consultar containerapp revision show -n "$app" -g "$RG" --revision "$revision" --query properties.provisioningState -o tsv || true)
              [ "$estado" = "Provisioned" ] && break
              sleep 10
            done
            echo "$app -> $revision ($estado)"
            [ "$estado" = "Provisioned" ] || { echo "::error::$app: la revisión $revision quedó en $estado"; exit 1; }
          done
          FQDN=$(consultar containerapp show -n "$APP_WEB" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          [ -n "$FQDN" ] || { echo "::error::$APP_WEB quedó sin ingreso externo"; exit 1; }
          URL="https://$FQDN"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Las apps arrancan desde cero réplicas: hasta ~10 minutos por ruta.
          for ruta in /login /api/management/status /api/audit-core/status; do
            for intento in $(seq 1 20); do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL$ruta" || true)
              [ "$codigo" = "200" ] && break
              sleep 10
            done
            echo "$ruta -> HTTP $codigo"
            [ "$codigo" = "200" ] || { echo "::error::$ruta no respondió 200"; exit 1; }
          done
          curl -sI "$URL/login" | grep -qi "^strict-transport-security" || { echo "::error::Falta el encabezado HSTS"; exit 1; }
          echo "Despliegue verificado: $URL" >> "$GITHUB_STEP_SUMMARY"
