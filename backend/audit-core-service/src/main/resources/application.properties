quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8082}
quarkus.http.test-port=0

app.name=audit-core-service
app.delivery=Entrega 2
app.version=${APP_VERSION:local}

# PostgreSQL compartido con management-service.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
# El esquema lo administra Flyway (db/migration); Hibernate solo valida que las entidades coincidan.
quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:validate}

# Ambos servicios comparten la base: cada uno migra sus tablas con su propio historial.
# baseline-version=0 permite migrar cuando el otro servicio ya creó sus tablas, sin saltear la V1.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.table=flyway_historial_audit_core
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
%dev.quarkus.hibernate-orm.log.sql=true

# Bitácora de excepciones en MongoDB (Cosmos DB en Azure). Timeouts cortos para no demorar
# la respuesta si MongoDB no responde; el error igual queda en el log.
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.server-selection-timeout=3S
quarkus.mongodb.connect-timeout=3S
quarkus.mongodb.devservices.enabled=false
auditnet.mongodb.base=${MONGODB_BASE:auditnet}

# Repositorio de archivos en Azure Blob Storage (Azurite en local). Sin cadena de conexión,
# los archivos quedan pendientes de subir desde el panel de administración.
auditnet.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
auditnet.storage.contenedor=${AZURE_STORAGE_CONTAINER:auditnet-archivos}
%dev.auditnet.storage.emulador-local=true

# ERROR (por defecto), WARN u OFF.
auditnet.bitacora.excepciones.nivel=${BITACORA_EXCEPCIONES_NIVEL:ERROR}

quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."ar.edu.uai.tfi".level=${LOG_LEVEL_APP:INFO}

# Valida los mismos JWT HS256 emitidos por management-service.
smallrye.jwt.verify.key-format=JWK_BASE64URL
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.issuer=tfi-auditoria
%dev.smallrye.jwt.sign.key=${JWT_VERIFY_JWK}
%dev.smallrye.jwt.verify.secretkey=${JWT_VERIFY_JWK}
%dev.smallrye.jwt.verify.algorithm=HS256
%dev.mp.jwt.verify.issuer=tfi-auditoria

# En cloud FRONTEND_ORIGIN apunta a la URL HTTPS del sitio Astro.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:4321}
%dev.quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:4321},http://127.0.0.1:4321
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept-Language
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.exposed-headers=Content-Disposition,X-AuditNet-SHA256,X-AuditNet-Integridad,X-Total-Count

# Avisos por correo: se guardan en la bandeja de salida de management-service y se le pide que los envíe.
# MANAGEMENT_URL es la dirección interna de management-service (en Azure, el FQDN interno de su Container App).
auditnet.management.url=${MANAGEMENT_URL:}
%dev.auditnet.management.url=${MANAGEMENT_URL:http://localhost:8081}

# Secreto de las tareas programadas (/internal/...), el mismo que management-service. Sin valor, responden 404.
auditnet.tareas.secreto=${TAREA_SECRETO:}
%dev.auditnet.tareas.secreto=${TAREA_SECRETO:solo-desarrollo-local}

# El perfil de test no usa PostgreSQL.
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.flyway.migrate-at-start=false
%test.smallrye.jwt.verify.secretkey=eyJrdHkiOiJvY3QiLCJrIjoiTURFeU16UTFOamM0T1dGaVkyUmxaakF4TWpNME5UWTNPRGxoWW1Oa1pXWXdNVEl6TkRVMk56ZzVZV0pqWkdWbU1ERXlNelExTmpjNE9XRmlZMlJsWmciLCJhbGciOiJIUzI1NiJ9
%test.smallrye.jwt.verify.algorithm=HS256
%test.mp.jwt.verify.issuer=tfi-auditoria
