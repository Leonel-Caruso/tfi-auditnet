quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8081}
quarkus.http.test-port=0

app.name=management-service
app.delivery=Entrega 2
app.version=${APP_VERSION:local}

# PostgreSQL compartido con audit-core-service.
# En local las variables las carga scripts/load-env.ps1; en Render vienen de la base administrada.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
# El esquema lo administra Flyway (db/migration); Hibernate solo valida que las entidades coincidan.
quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:validate}

# Cada servicio migra sus tablas con un historial propio porque comparten la base.
# baseline-version=0 permite migrar aunque el otro servicio ya haya creado sus tablas, sin saltear la V1.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.table=flyway_historial_management
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
%dev.quarkus.hibernate-orm.log.sql=true

# Bitácora de excepciones en MongoDB (Cosmos DB en Azure, docker compose en local).
# Timeouts cortos: si MongoDB no responde, el error queda igual en el log y la respuesta no se demora.
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.server-selection-timeout=3S
quarkus.mongodb.connect-timeout=3S
quarkus.mongodb.devservices.enabled=false
auditnet.mongodb.base=${MONGODB_BASE:auditnet}

# Nivel configurable de la bitácora de excepciones: ERROR (por defecto), WARN u OFF.
auditnet.bitacora.excepciones.nivel=${BITACORA_EXCEPCIONES_NIVEL:ERROR}

quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."ar.edu.uai.tfi".level=${LOG_LEVEL_APP:INFO}

# JWT HS256 compartido con audit-core-service. En producción start-render.sh deriva el JWK de
# verificación desde JWT_SECRET; en desarrollo lo genera load-env.ps1.
app.jwt.secret=${JWT_SECRET}
smallrye.jwt.verify.secretkey=${JWT_VERIFY_JWK}
smallrye.jwt.verify.key-format=JWK_BASE64URL
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.issuer=tfi-auditoria
%dev.smallrye.jwt.sign.key=${JWT_VERIFY_JWK}
%dev.smallrye.jwt.verify.secretkey=${JWT_VERIFY_JWK}
%dev.smallrye.jwt.verify.algorithm=HS256
%dev.mp.jwt.verify.issuer=tfi-auditoria
%dev.smallrye.jwt.new-token.issuer=tfi-auditoria
%dev.smallrye.jwt.new-token.lifespan=3600

# CORS. En cloud FRONTEND_ORIGIN apunta a la URL HTTPS del sitio Astro.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:4321}
%dev.quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:4321},http://127.0.0.1:4321
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=false

# Bootstrap minimo para primer acceso. Se ejecuta en dev y produccion, nunca en test.
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
app.bootstrap.organization.identifier=${BOOTSTRAP_ORG_IDENTIFIER}
app.bootstrap.organization.name=${BOOTSTRAP_ORG_NAME}

# Correo. En Azure: cadena de conexión de Communication Services (secreto) y remitente del dominio verificado.
# En local, sin esas dos, los avisos se envían a Mailpit (docker compose, http://localhost:8025).
# Sin ningún proveedor los avisos quedan pendientes en la bandeja de salida.
auditnet.url-publica=${APP_URL_PUBLICA:http://localhost:4321}
auditnet.correo.conexion=${CORREO_CONEXION:}
auditnet.correo.remitente=${CORREO_REMITENTE:}
auditnet.correo.mailpit-url=${MAILPIT_URL:}
%dev.auditnet.correo.mailpit-url=${MAILPIT_URL:http://localhost:8025}

# Secreto de las tareas programadas (/internal/...). Sin valor, esas rutas responden 404.
auditnet.tareas.secreto=${TAREA_SECRETO:}
%dev.auditnet.tareas.secreto=${TAREA_SECRETO:solo-desarrollo-local}

# El smoke test no requiere PostgreSQL ni datos de bootstrap.
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.flyway.migrate-at-start=false
%test.app.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
%test.smallrye.jwt.verify.secretkey=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
%test.smallrye.jwt.verify.algorithm=HS256
%test.mp.jwt.verify.issuer=tfi-auditoria
%test.smallrye.jwt.new-token.issuer=tfi-auditoria
%test.smallrye.jwt.new-token.lifespan=3600
