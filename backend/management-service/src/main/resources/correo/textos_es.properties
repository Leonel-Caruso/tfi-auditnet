recuperacion.asunto=Restablecer tu contraseña de AuditNet
recuperacion.titulo=Restablecer tu contraseña
recuperacion.pedido=Recibimos un pedido para restablecer la contraseña de tu usuario {usuario}. El enlace vale {minutos} minutos y se usa una sola vez.
recuperacion.ignorar=Si no lo pediste vos, ignorá este correo: tu contraseña no cambia.
recuperacion.boton=Elegir una contraseña nueva

alta.asunto=Tu acceso a AuditNet
alta.titulo=Ya tenés acceso a AuditNet
alta.usuario=Se creó tu usuario {usuario}.
