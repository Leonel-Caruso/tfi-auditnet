vencimientos.asunto=Revisión periódica de {organizacion}
vencimientos.titulo=Revisión periódica
vencimientos.vencidos.uno=1 hallazgo superó el plazo de corrección de su severidad.
vencimientos.vencidos.varios={cantidad} hallazgos superaron el plazo de corrección de su severidad.
vencimientos.desactualizados.uno=1 dispositivo no tiene una configuración nueva cargada hace tiempo: lo auditado puede no reflejar el estado real.
vencimientos.desactualizados.varios={cantidad} dispositivos no tienen una configuración nueva cargada hace tiempo: lo auditado puede no reflejar el estado real.
