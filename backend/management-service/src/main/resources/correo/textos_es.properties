solicitud.actual=Plan actual: {plan}
solicitud.solicitado=Plan pedido: {plan} ({modalidad})
solicitud.por=Pedido por: {usuario}
solicitud.comentario=Comentario: {comentario}
solicitud.boton=Resolver la solicitud

resuelta.aprobada.asunto=Plan {plan} aprobado
resuelta.aprobada.titulo=Solicitud aprobada
resuelta.aprobada.texto=La organización ya tiene el plan {plan}: los límites nuevos rigen desde ahora.
resuelta.rechazada.asunto=Solicitud de plan rechazada
resuelta.rechazada.titulo=Solicitud rechazada
resuelta.rechazada.texto=La solicitud de cambio al plan {plan} fue rechazada.
resuelta.respuesta=Respuesta: {respuesta}
resuelta.boton=Ver Mi plan

alertas.asunto.una=1 alerta nueva en {dispositivo}
alertas.asunto.varias={cantidad} alertas nuevas en {dispositivo}
alertas.titulo=Alertas nuevas en {dispositivo}
