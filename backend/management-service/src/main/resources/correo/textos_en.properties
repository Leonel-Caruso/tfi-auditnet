# Email texts in English. {name} placeholders are replaced with data, which is escaped before going into the HTML.
locale=en-US
periodo.formato=MMMM yyyy
marca=AuditNet · network configuration auditing
saludo=Hello {nombre},
saludo.anonimo=Hello,
organizacion.generica=your organization
pie.cuenta=Automated email from AuditNet: no need to reply.
pie.preferencia=You receive this notice because of your profile at {organizacion}. You can choose which notices to receive in My account.

perfil.ADMINISTRADOR_SISTEMA=System administrator
perfil.ADMINISTRADOR_ORGANIZACION=Organization administrator
perfil.ANALISTA_RED=Network analyst
perfil.AUDITOR_TECNICO=Technical auditor
perfil.RESPONSABLE_GESTION_IT=IT management lead
severidad.CRITICA=critical
severidad.ALTA=high
severidad.MEDIA=medium
severidad.BAJA=low
modalidad.MENSUAL=monthly
modalidad.ANUAL=yearly
riesgo.SIN_DATOS=no data
riesgo.BAJO=low
riesgo.MEDIO=medium
riesgo.ALTO=high

recuperacion.asunto=Reset your AuditNet password
recuperacion.titulo=Reset your password
recuperacion.pedido=We received a request to reset the password of your user {usuario}. The link is valid for {minutos} minutes and can be used only once.
recuperacion.ignorar=If you did not request it, ignore this email: your password stays the same.
recuperacion.boton=Choose a new password

alta.asunto=Your access to AuditNet
alta.titulo=You now have access to AuditNet
alta.usuario=Your user {usuario} was created.
alta.usuario.organizacion=Your user {usuario} was created in {organizacion}.
alta.contrasena=Whoever manages your access will give you the initial password. After signing in you can change it in My account.
alta.perfil=Profile: {perfil}
alta.boton=Sign in to AuditNet

solicitud.asunto=Plan change request from {organizacion}
solicitud.titulo=New plan change request
solicitud.pedido={organizacion} requested a plan change.
solicitud.actual=Current plan: {plan}
solicitud.solicitado=Requested plan: {plan} ({modalidad})
solicitud.por=Requested by: {usuario}
solicitud.comentario=Comment: {comentario}
solicitud.boton=Review the request

resuelta.aprobada.asunto=Plan {plan} approved
resuelta.aprobada.titulo=Request approved
resuelta.aprobada.texto=The organization now has the {plan} plan: the new limits apply from now on.
resuelta.rechazada.asunto=Plan request rejected
resuelta.rechazada.titulo=Request rejected
resuelta.rechazada.texto=The request to change to the {plan} plan was rejected.
resuelta.respuesta=Response: {respuesta}
resuelta.boton=See My plan

alertas.asunto.una=1 new alert on {dispositivo}
alertas.asunto.varias={cantidad} new alerts on {dispositivo}
alertas.titulo=New alerts on {dispositivo}
alertas.resumen=The audit of {dispositivo} ({nombre}) raised {detalle}.
alertas.detalle.una=1 alert
alertas.detalle.varias={cantidad} alerts
alertas.detalle.criticas={detalle}, {criticas} of critical severity
alertas.regla={codigo} · {nombre} ({severidad} severity)
alertas.boton=See alerts

vencimientos.asunto=Periodic review of {organizacion}
vencimientos.titulo=Periodic review
vencimientos.vencidos.uno=1 finding passed the remediation deadline for its severity.
vencimientos.vencidos.varios={cantidad} findings passed the remediation deadline for their severity.
vencimientos.desactualizados.uno=1 device has had no new configuration loaded for a while: what was audited may not reflect its current state.
vencimientos.desactualizados.varios={cantidad} devices have had no new configuration loaded for a while: what was audited may not reflect their current state.
vencimientos.parcial=Only the first ones are listed; the full detail is in the console.
vencimientos.vencido=Overdue for {dias} days: {codigo} · {nombre} on {dispositivo} ({severidad} severity)
vencimientos.desactualizado=No new configuration for {dias} days: {identificador} · {nombre}
vencimientos.boton=See findings

resumen.asunto={periodo} summary · {organizacion}
resumen.titulo={periodo} summary
resumen.introduccion=This is how {periodo} ended at {organizacion}.
resumen.auditorias=Audits run: {cantidad}
resumen.detectados=Findings detected: {cantidad}
resumen.cerrados=Findings closed: {cantidad}
resumen.pendientes=Findings pending at the end: {cantidad} (overdue: {vencidos})
resumen.alertas=Active alerts: {cantidad}
resumen.riesgo=Current risk level: {nivel}
resumen.boton=Open the dashboard
