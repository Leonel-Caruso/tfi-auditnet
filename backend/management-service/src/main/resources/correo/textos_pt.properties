# Textos dos e-mails em português do Brasil. {nome} é substituído pelo dado, que é escapado antes de ir ao HTML.
locale=pt-BR
periodo.formato=MMMM 'de' yyyy
marca=AuditNet · auditoria de configurações de rede
saludo=Olá, {nombre}:
saludo.anonimo=Olá:
organizacion.generica=sua organização
pie.cuenta=E-mail automático do AuditNet: não é preciso responder.
pie.preferencia=Você recebe este aviso pelo seu perfil em {organizacion}. Você pode escolher quais avisos receber em Minha conta.

perfil.ADMINISTRADOR_SISTEMA=Administrador do sistema
perfil.ADMINISTRADOR_ORGANIZACION=Administrador da organização
perfil.ANALISTA_RED=Analista de redes
perfil.AUDITOR_TECNICO=Auditor técnico
perfil.RESPONSABLE_GESTION_IT=Responsável pela gestão de TI
severidad.CRITICA=crítica
severidad.ALTA=alta
severidad.MEDIA=média
severidad.BAJA=baixa
modalidad.MENSUAL=mensal
modalidad.ANUAL=anual
riesgo.SIN_DATOS=sem dados
riesgo.BAJO=baixo
riesgo.MEDIO=médio
riesgo.ALTO=alto

recuperacion.asunto=Redefinir sua senha do AuditNet
recuperacion.titulo=Redefinir sua senha
recuperacion.pedido=Recebemos um pedido para redefinir a senha do seu usuário {usuario}. O link vale por {minutos} minutos e só pode ser usado uma vez.
recuperacion.ignorar=Se não foi você que pediu, ignore este e-mail: sua senha não muda.
recuperacion.boton=Escolher uma nova senha

alta.asunto=Seu acesso ao AuditNet
alta.titulo=Você já tem acesso ao AuditNet
alta.usuario=Seu usuário {usuario} foi criado.
alta.usuario.organizacion=Seu usuário {usuario} foi criado em {organizacion}.
alta.contrasena=A senha inicial é informada por quem administra seus acessos. Depois de entrar, você pode alterá-la em Minha conta.
alta.perfil=Perfil: {perfil}
alta.boton=Entrar no AuditNet

solicitud.asunto=Pedido de mudança de plano de {organizacion}
solicitud.titulo=Novo pedido de mudança de plano
solicitud.pedido={organizacion} pediu para mudar de plano.
solicitud.actual=Plano atual: {plan}
solicitud.solicitado=Plano pedido: {plan} ({modalidad})
solicitud.por=Pedido por: {usuario}
solicitud.comentario=Comentário: {comentario}
solicitud.boton=Resolver o pedido

resuelta.aprobada.asunto=Plano {plan} aprovado
resuelta.aprobada.titulo=Pedido aprovado
resuelta.aprobada.texto=A organização já está no plano {plan}: os novos limites valem a partir de agora.
resuelta.rechazada.asunto=Pedido de plano recusado
resuelta.rechazada.titulo=Pedido recusado
resuelta.rechazada.texto=O pedido de mudança para o plano {plan} foi recusado.
resuelta.respuesta=Resposta: {respuesta}
resuelta.boton=Ver Meu plano

alertas.asunto.una=1 novo alerta em {dispositivo}
alertas.asunto.varias={cantidad} novos alertas em {dispositivo}
alertas.titulo=Novos alertas em {dispositivo}
alertas.resumen=A auditoria de {dispositivo} ({nombre}) gerou {detalle}.
alertas.detalle.una=1 alerta
alertas.detalle.varias={cantidad} alertas
alertas.detalle.criticas={detalle}, {criticas} de severidade crítica
alertas.regla={codigo} · {nombre} (severidade {severidad})
alertas.boton=Ver alertas

vencimientos.asunto=Revisão periódica de {organizacion}
vencimientos.titulo=Revisão periódica
vencimientos.vencidos.uno=1 achado ultrapassou o prazo de correção da sua severidade.
vencimientos.vencidos.varios={cantidad} achados ultrapassaram o prazo de correção da sua severidade.
vencimientos.desactualizados.uno=1 dispositivo está há tempo sem uma configuração nova carregada: o que foi auditado pode não refletir o estado real.
vencimientos.desactualizados.varios={cantidad} dispositivos estão há tempo sem uma configuração nova carregada: o que foi auditado pode não refletir o estado real.
vencimientos.parcial=Mostramos os primeiros; o detalhe completo está no console.
vencimientos.vencido=Vencido há {dias} dias: {codigo} · {nombre} em {dispositivo} (severidade {severidad})
vencimientos.desactualizado=Sem configuração nova há {dias} dias: {identificador} · {nombre}
vencimientos.boton=Ver achados

resumen.asunto=Resumo de {periodo} · {organizacion}
resumen.titulo=Resumo de {periodo}
resumen.introduccion=Assim terminou {periodo} em {organizacion}.
resumen.auditorias=Auditorias executadas: {cantidad}
resumen.detectados=Achados detectados: {cantidad}
resumen.cerrados=Achados fechados: {cantidad}
resumen.pendientes=Achados pendentes no fechamento: {cantidad} (vencidos: {vencidos})
resumen.alertas=Alertas vigentes: {cantidad}
resumen.riesgo=Nível de risco atual: {nivel}
resumen.boton=Abrir o painel
