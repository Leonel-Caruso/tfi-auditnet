<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sin conexión · AuditNet</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#171a1f" />
    <style>
      @font-face { font-family: "AuditNet Mono"; src: url("/fonts/jetbrains-mono-800.woff2") format("woff2"); font-weight: 800; }
      * { box-sizing: border-box; }
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; color: #e6e9ec; background: #171a1f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(100%, 440px); text-align: center; }
      .mark { display: inline-grid; place-items: center; width: 64px; height: 64px; margin-bottom: 22px; border-radius: 13px; color: #fff; background: #f57c00; font: 800 1.35rem "AuditNet Mono", Consolas, monospace; }
      h1 { margin: 0 0 10px; font-size: 1.4rem; }
      p { margin: 0 0 22px; color: #9aa2aa; line-height: 1.55; }
      a { display: inline-block; padding: 11px 18px; border-radius: 8px; color: #fff; background: #f57c00; font-weight: 700; text-decoration: none; }
      a:hover { background: #d96500; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A_</div>
      <h1>Sin conexión</h1>
      <p>AuditNet necesita conexión para mostrar datos actualizados. Revisá tu red y volvé a intentar; por seguridad no se guarda información de auditorías en este dispositivo.</p>
      <a href="">Reintentar</a>
    </main>
  </body>
</html>
