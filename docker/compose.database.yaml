services:
  postgres:
    image: postgres:17-alpine
    container_name: tfi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tfi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bitácora de excepciones (en Azure: Cosmos DB para MongoDB)
  mongo:
    image: mongo:7
    container_name: tfi-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - tfi_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Emulador de Blob Storage con la cuenta pública devstoreaccount1; audit-core lo usa solo en el perfil dev.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: tfi-azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data"]
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - tfi_azurite_data:/data

volumes:
  tfi_postgres_data:
  tfi_mongo_data:
  tfi_azurite_data:
