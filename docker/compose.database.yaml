services:
  postgres:
    image: postgres:17-alpine
    container_name: tfi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tfi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bloque 2.3c: MongoDB local para la bitácora de excepciones (en Azure: Cosmos DB para MongoDB)
  mongo:
    image: mongo:7
    container_name: tfi-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - tfi_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tfi_postgres_data:
  tfi_mongo_data:
